name: Build BetterSkies

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew remapJar --stacktrace 2>&1 | tee build.log
      - name: Dump API signatures (dev aid)
        if: always() && hashFiles('tools/api-classes.txt') != ''
        run: bash tools/dump-api.sh > api-dump.txt 2>&1 || true
      - name: In-game smoke test (screenshots)
        if: success()
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace 2>&1 | tee gametest.log | tail -60
      - name: Save build log to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ 2>/dev/null || true
          cp api-dump.txt /tmp/logs/ 2>/dev/null || true
          cp gametest.log /tmp/logs/ 2>/dev/null || true
          mkdir -p /tmp/logs/shots
          find . -name '*.png' -path '*screenshot*' -newer build.log -exec cp {} /tmp/logs/shots/ \; 2>/dev/null || true
          find . -name 'latest.log' -path '*run*' -exec cp {} /tmp/logs/game-latest.log \; 2>/dev/null || true
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "logs for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: BetterSkies-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n1)
          VER=$(grep '^mod_version' gradle.properties | cut -d= -f2)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "BetterSkies $VER (latest build)" \
            --notes "Automatic build of commit ${GITHUB_SHA::7} for Minecraft 1.21.11 (Fabric). Download the .jar below, put it in your mods folder next to Fabric API, and press F12 in game to open BetterSkies Studio."
