name: Build BetterSkies

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
      - name: Dump API signatures (dev aid)
        if: always() && hashFiles('tools/api-classes.txt') != ''
        run: bash tools/dump-api.sh > api-dump.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('api-dump.txt') != ''
        with:
          name: api-dump
          path: api-dump.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BetterSkies-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n1)
          VER=$(grep '^mod_version' gradle.properties | cut -d= -f2)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "BetterSkies $VER (latest build)" \
            --notes "Automatic build of commit ${GITHUB_SHA::7} for Minecraft 1.21.11 (Fabric). Download the .jar below, put it in your mods folder next to Fabric API, and press F12 in game to open BetterSkies Studio."
