plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    // src/main/java/com/terraformersmc holds tiny copies of the Mod Menu API so Mod Menu
    // stays optional and the build never needs its maven. The real classes come from Mod Menu.
    exclude 'com/terraformersmc/**'
    exclude 'dev/betterskies/devtools/**'
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Dev aid: prints vanilla render pipeline settings (used while developing the renderer).
tasks.register('dumpPipelines', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.betterskies.devtools.PipelineDump'
    ignoreExitValue = true
}
